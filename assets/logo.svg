<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="flower new tab">
  <!--
    flower new tab 的图标（方向乙：墨底方章 + 挖空五瓣花 + 琥珀花心）。

    为什么用「实底 + 挖空」而不是直接画一朵花：
    16px 是这个图标的生死线。细笔画、细花瓣缝隙在 16px 下都会糊成一团 ——
    上一版（无底尖瓣 + 琥珀点）就是这么废掉的。
    挖空的形状靠**明暗对比**定义，不依赖留白，所以 16 / 48 / 128 三档都清晰。

    琥珀花心是刻意留的：给整张图一个暖色焦点，与界面的墨色体系
    （#3A3532）和暖色强调（#D69E2E）呼应，也让小尺寸下有个可辨识的锚点。
  -->
  <defs>
    <mask id="knockout">
      <rect width="128" height="128" fill="#fff"/>
      <!-- 五瓣挖空。瓣宽约 19、瓣尖在半径 36 处，瓣间留出的空档在 16px 下仍可见。 -->
      <g fill="#000">
        <path d="M64 66C55 55 54 37 64 28C74 37 73 55 64 66Z"/>
        <path d="M64 66C55 55 54 37 64 28C74 37 73 55 64 66Z" transform="rotate(72 64 64)"/>
        <path d="M64 66C55 55 54 37 64 28C74 37 73 55 64 66Z" transform="rotate(144 64 64)"/>
        <path d="M64 66C55 55 54 37 64 28C74 37 73 55 64 66Z" transform="rotate(216 64 64)"/>
        <path d="M64 66C55 55 54 37 64 28C74 37 73 55 64 66Z" transform="rotate(288 64 64)"/>
      </g>
      <!-- 花心也挖空，给琥珀色让位 -->
      <circle cx="64" cy="64" r="11" fill="#fff"/>
    </mask>
  </defs>

  <rect width="128" height="128" rx="30" fill="#3A3532" mask="url(#knockout)"/>
  <circle cx="64" cy="64" r="8" fill="#D69E2E"/>
</svg>
